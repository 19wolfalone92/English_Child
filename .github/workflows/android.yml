name: Eva English Kids Android APK
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate child course and JavaScript
        run: |
          node scripts/test_course.mjs
          node scripts/audit_assets.mjs
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "Android SDK: $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble installable debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - name: Verify APK archive and Android signature
        run: |
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          # Android 13 compatible min/target SDK, package ID and launcher class.
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-badging.txt
          grep -F "package: name='com.eva.english.kids'" apk-badging.txt
          grep -F "sdkVersion:'24'" apk-badging.txt
          grep -F "targetSdkVersion:'35'" apk-badging.txt
          grep -F "launchable-activity: name='com.wolfie.kids.MainActivity'" apk-badging.txt
          "$SIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-English-Kids-v0.7.0-Android13
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build separately installable Android 13 edition
        run: |
          gradle --no-daemon -PfreshInstall :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Eva-English-Kids-v0.7.0-FRESH.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/Eva-English-Kids-v0.7.0-FRESH.apk | grep -F "package: name='com.eva.english.kids.fresh070'"
          "$SIGNER" verify --verbose app/build/outputs/apk/debug/Eva-English-Kids-v0.7.0-FRESH.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Eva-English-Kids-v0.7.0-FRESH-Android13
          path: app/build/outputs/apk/debug/Eva-English-Kids-v0.7.0-FRESH.apk
          if-no-files-found: error

