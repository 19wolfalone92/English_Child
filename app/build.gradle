plugins { id 'com.android.application' }
android {
  namespace 'com.wolfie.kids'
  compileSdk 35
  defaultConfig {
    applicationId 'com.eva.english.kids'
    // Diagnostic side-by-side build, preserving an older differently signed installation.
    if (project.hasProperty('freshInstall')) applicationIdSuffix '.fresh091'
    minSdk 24
    targetSdk 35
    versionCode 12
    versionName '0.9.1'
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  buildTypes { release { minifyEnabled false } }
}
