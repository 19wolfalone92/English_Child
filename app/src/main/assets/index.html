<!doctype html>
<html lang="ru" data-theme="lilac">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8f3">
  <meta name="color-scheme" content="light">
  <title>Eva English Kids — Сказочный английский Евы</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="extras.css">
  <link rel="stylesheet" href="storybook.css">
  <link rel="stylesheet" href="magic-world.css">
  <link rel="stylesheet" href="eva-preschool.css">
  <link rel="stylesheet" href="memory-alphabet.css">
  <link rel="stylesheet" href="teacherpath.css">
  <script src="identity.js" defer></script>
  <script src="content.js" defer></script>
  <script src="phonics.js" defer></script>
  <script src="stories.js" defer></script>
  <script src="dialogues.js" defer></script>
  <script src="adventures.js" defer></script>
  <script src="soundgarden.js" defer></script>
  <script src="firststeps.js" defer></script>
  <script src="alphabetquest.js" defer></script>
  <script src="wordmemory.js" defer></script>
  <script src="teacherpath.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<div id="root">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" role="img" aria-label="Волчонок Вулфи"><img src="wolfie.svg" alt="" aria-hidden="true"></span>
      <div><strong id="brand-title">Eva English Kids</strong><small id="brand-subtitle">Вулфи и Ева учат английский!</small></div>
    </div>
    <div class="indicators"><span id="xp" title="Мои звёздочки">⭐ 0</span></div>
    <div class="header-actions">
      <button type="button" id="theme-open" class="header-icon" title="Поменять цвета" aria-label="Поменять цвета оформления">🎨</button>
      <button type="button" id="family-open" class="header-icon parent-icon" title="Для родителей" aria-label="Вход для родителей">⚙️</button>
    </div>
    <span id="daily" hidden aria-hidden="true">🎯 0/10</span>
  </header>
  <main id="view" aria-live="polite">
    <section class="hero"><h1>Привет!</h1><p>Ева, открываем волшебный мир!</p></section>
  </main>
  <nav class="bottom" aria-label="Главное меню">
    <button type="button" data-tab="home" class="selected"><span aria-hidden="true">🏠</span>Домик</button>
    <button type="button" data-tab="play"><span aria-hidden="true">🎮</span>Игры</button>
    <button type="button" data-tab="stories"><span aria-hidden="true">📚</span>Сказки</button>
    <button type="button" data-tab="rewards"><span aria-hidden="true">🏅</span>Награды</button>
  </nav>
</div>
<div id="theme-overlay" class="theme-overlay" hidden></div>
</body>
</html>
