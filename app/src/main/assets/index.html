<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff9ec">
  <meta name="color-scheme" content="light">
  <title>Wolfie Kids · Английский от нуля до B2</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="extras.css">
  <script src="content.js" defer></script>
  <script src="phonics.js" defer></script>
  <script src="stories.js" defer></script>
  <script src="dialogues.js" defer></script>
  <script src="adventures.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<div id="root">
  <header class="top">
    <div class="brand">
      <span class="brand-mark" role="img" aria-label="Волчонок Вулфи">🐺</span>
      <div><strong>Wolfie <em>Kids</em></strong><small>Играй. Слушай. Говори!</small></div>
    </div>
    <div class="indicators"><span id="xp" title="Звёзды">⭐ 0</span><span id="daily" title="Цель дня">🎯 0/10</span></div>
  </header>
  <main id="view" aria-live="polite">
    <section class="hero"><div class="hero-emoji">🐺</div><h1>Добро пожаловать!</h1><p>Загружаем твою карту приключений...</p></section>
  </main>
  <nav class="bottom" aria-label="Главное меню">
    <button type="button" data-tab="home" class="selected"><span aria-hidden="true">🗺️</span>Уроки</button>
    <button type="button" data-tab="play"><span aria-hidden="true">🎮</span>Играть</button>
    <button type="button" data-tab="review"><span aria-hidden="true">🧠</span>Повторить</button>
    <button type="button" data-tab="family"><span aria-hidden="true">👨‍👩‍👧</span>Родителям</button>
  </nav>
</div>
</body>
</html>
